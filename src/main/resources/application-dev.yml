# =============================================
# 智学伴（StudyMate）开发环境配置
# =============================================

# 本地开发环境变量
DB_URL: jdbc:mysql://localhost:3306/studyplan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
DB_USERNAME: root
DB_PASSWORD: smileday159

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# MyBatis-Plus 开发环境配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    root: INFO
    com.jiang: DEBUG
    org.springframework.web: DEBUG

# 线程池配置
thread-pool:
  ai:
    core-size: 4
    queue-capacity: 50
    await-terminate-seconds: 30
  exam-analysis:
    core-size: 3
    queue-capacity: 30
    await-terminate-seconds: 60


