# =============================================
# 智学伴（StudyMate）应用配置
# 注意：此文件位于受保护目录，需人工审批
# =============================================

server:
  port: 80

spring:
  application:
    name: StudyPlan

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/studyplan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:7emAdKSb}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      # 注意：不配置全局逻辑删除，学习记录与日志表遵循"只读不删"原则（产品规则 #9）
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000  # 2小时（毫秒）
  refresh-threshold: 300000  # 5分钟（毫秒）

# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}
  api-url: ${WECHAT_API_URL:https://api.weixin.qq.com/sns/jscode2session}

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 数据模型

# 日志配置
logging:
  level:
    root: INFO
    com.jiang: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
